name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Inject launcher version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Bake the version into the launcher so it knows its own build number
          node -e "const fs=require('fs');const v=process.argv[1];const f='src/Launcher.html';let s=fs.readFileSync(f,'utf8');s=s.replace(/const LAUNCHER_VERSION = \"[^\"]*\"/,'const LAUNCHER_VERSION = \"'+v+'\"');fs.writeFileSync(f,s);" "$VERSION"
          echo "Injected LAUNCHER_VERSION=$VERSION"

      - name: Build Tauri app
        run: npm run build

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n1)
          cp "$EXE" "dist/GrigoriNightDragon-Setup.exe"
          # manifest.json for launcher self-update: preserve game fields (incl. gameUrl),
          # stamp launcherVersion + the just-built installer URL so new builds auto-resolve.
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          node -e "const fs=require('fs');const v=process.argv[1];const base=process.argv[2];const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));m.launcherVersion=v;m.launcherUrl=base+'/releases/download/latest-build/GrigoriNightDragon-Setup.exe';fs.writeFileSync('dist/manifest.json',JSON.stringify(m,null,2));" "$APP_VERSION" "$REPO_URL"
          echo "Prepared release assets:"; ls -la dist

      - name: Upload NSIS installer (.exe)
        uses: actions/upload-artifact@v5
        with:
          name: GrigoriNightDragon-Setup-exe
          path: dist/GrigoriNightDragon-Setup.exe

      - name: Upload MSI installer
        uses: actions/upload-artifact@v5
        with:
          name: GrigoriNightDragon-Setup-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Build
          prerelease: true
          files: |
            dist/GrigoriNightDragon-Setup.exe
            dist/manifest.json
            src-tauri/target/release/bundle/msi/*.msi
