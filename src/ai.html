<!-- =====================================================================
     GrigoriNight Dragon Launcher — GoDaddy "paste once" loader
     ---------------------------------------------------------------------
     Paste this whole block ONCE into the GoDaddy custom-code / HTML
     section for the launcher page. At runtime it pulls the latest built
     launcher (Launcher.godaddy.html) from the PUBLIC gnd-news repo on
     GitHub and renders it right here. After this is in place you never
     re-paste the ~51 KB build again: run build_web.py, publish
     Launcher.godaddy.html to gnd-news, and the website updates itself.

     Why gnd-news: the launcher repo is PRIVATE, so its raw files can't be
     fetched without a token — and a token must NEVER live in page HTML.
     gnd-news is already public (it serves the news), so the build is
     hosted there with no secret in this file.

     Publish target (change only if you move the file):
       https://raw.githubusercontent.com/GrigoriNight/gnd-news/main/Launcher.godaddy.html
     ===================================================================== -->
<div id="gnd-loader" style="min-height:240px;color:#bbb;font:14px system-ui,Arial,sans-serif;text-align:center;padding:48px 16px">
  Loading launcher&hellip;
</div>
<script>
(function () {
  // Public raw URL of the built launcher HTML. No token needed (public repo).
  // The ?t= cache-buster mirrors how the launcher already fetches news.html.
  var SRC   = "https://raw.githubusercontent.com/GrigoriNight/gnd-news/main/Launcher.godaddy.html";
  var mount = document.getElementById("gnd-loader");

  function fail(msg) {
    mount.innerHTML =
      '<div style="color:#f88;font:14px system-ui,Arial,sans-serif;padding:48px 16px;text-align:center">' +
      'Could not load the launcher.<br>' +
      '<span style="color:#888;font-size:12px">' + (msg || "") + '</span></div>';
  }

  // Re-create one <script> so it actually executes (scripts set via innerHTML
  // are inert per the HTML spec). External scripts are load-gated so the app
  // script only runs once Tailwind / EmailJS / fflate are ready.
  function runScript(old, done) {
    var s = document.createElement("script"), i, a;
    for (i = 0; i < old.attributes.length; i++) {
      a = old.attributes[i];
      s.setAttribute(a.name, a.value);
    }
    if (old.src) {
      s.onload = s.onerror = function () { done(); };
      document.body.appendChild(s);          // fetch starts on insert
    } else {
      s.text = old.textContent;
      document.body.appendChild(s);          // classic inline runs synchronously
      done();
    }
  }

  function runAll(list, i) {
    if (i >= list.length) return;
    runScript(list[i], function () { runAll(list, i + 1); });
  }

  // Only these types execute; a data island (type="application/json") is left
  // untouched so getElementById("gnd-news-data") still resolves for the app.
  function isExecutable(el) {
    var t = (el.getAttribute("type") || "").toLowerCase();
    return t === "" || t === "text/javascript" || t === "application/javascript" || t === "module";
  }

  fetch(SRC + "?t=" + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function (html) {
      mount.innerHTML = html;                // markup + <style> apply immediately
      var all = [].slice.call(mount.querySelectorAll("script"));
      var exec = [];
      all.forEach(function (el) {
        if (isExecutable(el)) { exec.push(el); el.parentNode.removeChild(el); }
      });
      runAll(exec, 0);                       // re-run JS scripts in document order
    })
    .catch(function (e) { fail(e && e.message); });
})();
</script>
