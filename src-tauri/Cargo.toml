[package]
name = "grigorinightdragon-launcher"
version = "1.0.0"
description = "GrigoriNightDragon Launcher"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only: game downloader + unzip. Kept out of Android builds.
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
